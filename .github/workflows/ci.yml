name: CI

# Checks every push and PR; a push to main that passes all checks and changed
# the integration is published as the next patch release. HACS installs this
# integration from release zips only (hacs.json: zip_release), so a release is
# what makes a change show up as an update in HACS.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2025.5.3"
            python-version: "3.13"
          - home-assistant: "2025.6.0"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install homeassistant~=${{ matrix.home-assistant }}
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      - name: Type check with mypy
        run: |
          touch "$(python -c 'import inspect, homeassistant, os; print(os.path.dirname(inspect.getfile(homeassistant)))')"/py.typed
          mypy -p custom_components.hon
      - name: Check black style
        run: |
          black . --check

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  release:
    needs: [checks, hassfest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide next version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && [ -z "$(git diff --name-only "$last" HEAD -- custom_components/)" ]; then
            echo "No integration changes since $last, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          echo "Releasing $next (previous: ${last:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: |
          tag=${{ steps.version.outputs.tag }}
          cd custom_components/hon
          jq --arg v "${tag#v}" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r "$GITHUB_WORKSPACE/haier_hon.zip" ./

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" haier_hon.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
